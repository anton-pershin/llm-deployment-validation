[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-deployment-validation"
version = "0.1.0"
description = "Validation service for the llm-deployment SDD subproject"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3",
    "requests",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "pylint",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["llm_deployment_validation*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
